name: Publish Quarto site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >
            any::knitr
            any::rmarkdown
            any::dplyr
            any::ggplot2
            any::scales
            any::tibble

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore file modification times from git history
        run: |
          git ls-files '*.qmd' | while read file; do
            ts=$(git log -1 --format="%ai" -- "$file")
            touch -d "$ts" "$file"
          done

      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
